apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-xietong.userServiceName" . }}
  labels:
    {{- include "go-xietong.labels" . | nindent 4 }}
    app.kubernetes.io/component: project-user
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: {{ .Values.user.service.port }}
      targetPort: grpc
  selector:
    {{- include "go-xietong.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: project-user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-xietong.fullname" . }}-project-user
  labels:
    {{- include "go-xietong.labels" . | nindent 4 }}
    app.kubernetes.io/component: project-user
spec:
  replicas: {{ .Values.user.replicaCount }}
  selector:
    matchLabels:
      {{- include "go-xietong.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: project-user
  template:
    metadata:
      labels:
        {{- include "go-xietong.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: project-user
    spec:
      securityContext:
        fsGroup: 10001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: project-user
          image: "{{ .Values.images.user.repository }}:{{ .Values.images.user.tag }}"
          imagePullPolicy: {{ .Values.images.user.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 8881
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: GIN_MODE
              value: {{ .Values.runtime.ginMode | quote }}
            - name: MS_MYSQL_USER
              value: {{ .Values.mysql.username | quote }}
            - name: MS_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-xietong.secretName" . }}
                  key: MS_MYSQL_PASSWORD
            - name: MS_MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-xietong.secretName" . }}
                  key: MS_REDIS_PASSWORD
            - name: MS_JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-xietong.secretName" . }}
                  key: MS_JWT_ACCESS_SECRET
            - name: MS_JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-xietong.secretName" . }}
                  key: MS_JWT_REFRESH_SECRET
            - name: MS_CAPTCHA_EXPOSE_CODE
              value: {{ .Values.runtime.captchaExposeCode | quote }}
            - name: MS_SMS_PROVIDER
              value: {{ .Values.runtime.sms.provider | quote }}
            - name: MS_SMS_SECRET_ID
              value: {{ .Values.runtime.sms.secretID | quote }}
            - name: MS_SMS_SECRET_KEY
              value: {{ .Values.runtime.sms.secretKey | quote }}
            - name: MS_SMS_REGION
              value: {{ .Values.runtime.sms.region | quote }}
            - name: MS_SMS_ENDPOINT
              value: {{ .Values.runtime.sms.endpoint | quote }}
            - name: MS_SMS_SDK_APP_ID
              value: {{ .Values.runtime.sms.sdkAppID | quote }}
            - name: MS_SMS_SIGN_NAME
              value: {{ .Values.runtime.sms.signName | quote }}
            - name: MS_SMS_TEMPLATE_ID
              value: {{ .Values.runtime.sms.templateID | quote }}
            - name: MS_SMS_COUNTRY_CODE
              value: {{ .Values.runtime.sms.countryCode | quote }}
            - name: MS_SMS_SESSION_CONTEXT
              value: {{ .Values.runtime.sms.sessionContext | quote }}
            - name: MS_SMS_TIMEOUT_SECONDS
              value: {{ .Values.runtime.sms.timeoutSeconds | quote }}
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.user.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: project-user.yaml
            - name: logs
              mountPath: /logs
      volumes:
        - name: config
          configMap:
            name: {{ include "go-xietong.fullname" . }}-config
            items:
              - key: project-user.yaml
                path: project-user.yaml
        - name: logs
          emptyDir: {}
