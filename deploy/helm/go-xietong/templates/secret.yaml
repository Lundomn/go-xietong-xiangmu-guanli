{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-xietong.secretName" . }}
  labels:
    {{- include "go-xietong.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ required "secrets.mysqlRootPassword is required" .Values.secrets.mysqlRootPassword | quote }}
  MS_MYSQL_PASSWORD: {{ required "secrets.mysqlPassword is required" .Values.secrets.mysqlPassword | quote }}
  MS_REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  MS_JWT_ACCESS_SECRET: {{ required "secrets.jwtAccessSecret is required" .Values.secrets.jwtAccessSecret | quote }}
  MS_JWT_REFRESH_SECRET: {{ required "secrets.jwtRefreshSecret is required" .Values.secrets.jwtRefreshSecret | quote }}
{{- end }}
