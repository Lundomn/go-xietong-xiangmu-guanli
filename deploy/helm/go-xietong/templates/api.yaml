apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-xietong.apiServiceName" . }}
  labels:
    {{- include "go-xietong.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "go-xietong.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-xietong.fullname" . }}-api
  labels:
    {{- include "go-xietong.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "go-xietong.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "go-xietong.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 10001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: GIN_MODE
              value: {{ .Values.runtime.ginMode | quote }}
            - name: MS_AI_PROVIDER
              value: {{ .Values.runtime.ai.provider | quote }}
            - name: MS_AI_API_URL
              value: {{ .Values.runtime.ai.apiURL | quote }}
            - name: MS_AI_API_KEY
              value: {{ .Values.runtime.ai.apiKey | quote }}
            - name: MS_AI_MODEL
              value: {{ .Values.runtime.ai.model | quote }}
            - name: MS_AI_TIMEOUT_SECONDS
              value: {{ .Values.runtime.ai.timeoutSeconds | quote }}
            - name: MS_CAPTCHA_EXPOSE_CODE
              value: {{ .Values.runtime.captchaExposeCode | quote }}
            - name: ENABLE_PPROF
              value: {{ .Values.runtime.enablePprof | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: project-api.yaml
            - name: logs
              mountPath: /logs
            - name: uploads
              mountPath: /app/upload
      volumes:
        - name: config
          configMap:
            name: {{ include "go-xietong.fullname" . }}-config
            items:
              - key: project-api.yaml
                path: project-api.yaml
        - name: logs
          emptyDir: {}
        - name: uploads
          {{- if .Values.persistence.uploads.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "go-xietong.fullname" . }}-uploads
          {{- else }}
          emptyDir: {}
          {{- end }}
